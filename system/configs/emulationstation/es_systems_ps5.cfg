<?xml version="1.0" encoding="UTF-8"?>
<systemList>
  <system>
    <fullname>PlayStation 5 (KytyPS5)</fullname>
    <name>ps5</name>
    <manufacturer>Sony</manufacturer>
    <release>2020</release>
    <hardware>console</hardware>
    <path>/userdata/roms/ps5</path>
    <extension>.elf .ELF .bin .BIN .zar .ZAR .ps5</extension>
    <command>python /userdata/system/ps5/launch/run.py %CONTROLLERSCONFIG% -system %SYSTEM% -emulator %EMULATOR% -core %CORE% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%</command>
    <platform>ps5</platform>
    <emulators>
      <emulator name="kyty">
        <cores>
          <core default="true">default</core>
        </cores>
      </emulator>
      <emulator name="kyty-u59">
        <cores>
          <core >default</core>
        </cores>
      </emulator>
    </emulators>
  </system>
</systemList>
